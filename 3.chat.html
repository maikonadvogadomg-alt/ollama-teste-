<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat com Ollama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      height: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .status {
      font-size: 12px;
      opacity: 0.9;
    }

    .status.connected {
      color: #4ade80;
    }

    .status.disconnected {
      color: #f87171;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      animation: slideIn 0.3s ease-in-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 10px;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 0;
    }

    .message.bot .message-content {
      background: #e5e7eb;
      color: #333;
      border-bottom-left-radius: 0;
    }

    .loading {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .loading span {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .loading span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0);
        opacity: 0.5;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .input-area button:active {
      transform: translateY(0);
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #dc2626;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>💬 Chat com Ollama</h1>
      <div class="status disconnected" id="status">Conectando...</div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="message bot">
        <div class="message-content">
          Olá! Sou uma IA rodando localmente com Ollama. Como posso ajudar?
        </div>
      </div>
    </div>

    <div class="input-area">
      <input
                type="text"
                id="userInput"
                placeholder="Digite sua pergunta..."
                autocomplete="off"
            >
      <button id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');

        let isConnected = false;
        let isWaiting = false;

        // Verificar conexão com Ollama
        async function checkConnection() {
            try {
                const response = await fetch('http://localhost:11434/api/tags');
                if (response.ok) {
                    isConnected = true;
                    statusDiv.textContent = '✅ Conectado com Ollama';
                    statusDiv.className = 'status connected';
                    console.log('Conectado com Ollama!');
                } else {
                    throw new Error('Ollama não respondeu');
                }
            } catch (error) {
                isConnected = false;
                statusDiv.textContent = '❌ Ollama não conectado';
                statusDiv.className = 'status disconnected';
                console.error('Erro ao conectar:', error);
            }
        }

        // Enviar mensagem
        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;
            if (isWaiting) return;
            if (!isConnected) {
                addMessage('Erro: Ollama não está conectado. Verifique se está rodando.', 'bot');
                return;
            }

            // Adicionar mensagem do usuário
            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            isWaiting = true;

            // Adicionar indicador de carregamento
            const loadingId = 'loading-' + Date.now();
            addMessage('<div class="loading"><span></span><span></span><span></span></div>', 'bot', loadingId);

            try {
                // Enviar para Ollama
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'llama2',
                        prompt: message,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error('Erro ao conectar com Ollama');
                }

                const data = await response.json();
                const botResponse = data.response;

                // Remover indicador de carregamento
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    loadingElement.remove();
                }

                // Adicionar resposta da IA
                addMessage(botResponse, 'bot');

            } catch (error) {
                console.error('Erro:', error);
                
                // Remover indicador de carregamento
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    loadingElement.remove();
                }

                addMessage('Erro ao conectar com Ollama. Verifique se está rodando.', 'bot');
            } finally {
                sendBtn.disabled = false;
                isWaiting = false;
                userInput.focus();
            }
        }

        // Adicionar mensagem ao chat
        function addMessage(text, sender, id = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (id) messageDiv.id = id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = text;

            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);

            // Scroll para baixo
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Enviar ao pressionar Enter
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isWaiting) {
                sendMessage();
            }
        });

        // Verificar conexão ao carregar
        window.addEventListener('load', () => {
            checkConnection();
            userInput.focus();
        });

        // Verificar conexão a cada 5 segundos
        setInterval(checkConnection, 5000);
  </script>
</body>

</html>
