<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>💬 Chat Ollama — Sem Terminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .status {
      display: inline-block;
      padding: 5px 15px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
    }
    .status.conectado { background: #4caf50; }
    .status.desconectado { background: #f44336; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .mensagem {
      display: flex;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mensagem.usuario { justify-content: flex-end; }
    .msg-conteudo {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 10px;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .usuario .msg-conteudo {
      background: #667eea;
      color: white;
      border-radius: 15px 0 15px 15px;
    }
    .ia .msg-conteudo {
      background: #f0f0f0;
      color: #333;
      border-radius: 0 15px 15px 15px;
    }
    .input-area {
      border-top: 1px solid #eee;
      padding: 15px;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #667eea; }
    button {
      padding: 12px 25px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover { background: #764ba2; transform: scale(1.05); }
    button:disabled { background: #ccc; cursor: not-allowed; transform: scale(1); }
    .info {
      background: #f9f9f9;
      border-top: 1px solid #eee;
      padding: 15px;
      font-size: 12px;
      color: #666;
    }
    .loading {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>💬 Chat Ollama</h1>
    <div class="status" id="status">🔴 Desconectado</div>
  </div>
  
  <div class="chat" id="chat">
    <div class="mensagem ia">
      <div class="msg-conteudo">
        Olá! Sou o Ollama. Clique em "Conectar" para começar a conversar comigo. Funciono localmente no seu computador, sem custos! 😊
      </div>
    </div>
  </div>
  
  <div class="input-area">
    <input type="text" id="entrada" placeholder="Digite sua pergunta..." onkeypress="if(event.key==='Enter') enviar()">
    <button onclick="conectar()" id="btnConectar">🔗 Conectar</button>
    <button onclick="enviar()" id="btnEnviar" disabled>Enviar</button>
  </div>
  
  <div class="info">
    ℹ️ <strong>Dica:</strong> Certifique-se de que o Ollama está rodando no terminal com o comando: <code>ollama serve</code>
  </div>
</div>

<script>
  const API = 'http://localhost:11434/api/generate';
  let conectado = false;
  let modelo = 'llama2';
  
  async function conectar() {
    const status = document.getElementById('status');
    const btn = document.getElementById('btnConectar');
    
    status.textContent = '⏳ Testando...';
    btn.disabled = true;
    
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelo,
          prompt: 'teste',
          stream: false
        })
      });
      
      if (res.ok) {
        status.textContent = '🟢 Conectado!';
        status.className = 'status conectado';
        conectado = true;
        btn.textContent = '✅ Conectado';
        document.getElementById('btnEnviar').disabled = false;
        document.getElementById('entrada').focus();
      } else {
        throw new Error('Erro');
      }
    } catch (e) {
      status.textContent = '🔴 Desconectado';
      status.className = 'status desconectado';
      conectado = false;
      btn.disabled = false;
      btn.textContent = '🔗 Conectar';
      alert('❌ Não consegui conectar ao Ollama!\n\nAbra o terminal e digite:\n\nollama serve\n\nDepois tente novamente.');
    }
  }
  
  async function enviar() {
    if (!conectado) {
      alert('⚠️ Clique em "Conectar" primeiro!');
      return;
    }
    
    const entrada = document.getElementById('entrada');
    const texto = entrada.value.trim();
    
    if (!texto) return;
    
    // Adicionar mensagem do usuário
    adicionarMensagem(texto, 'usuario');
    entrada.value = '';
    
    // Mostrar digitando
    const chat = document.getElementById('chat');
    const digitando = document.createElement('div');
    digitando.className = 'mensagem ia';
    digitando.id = 'digitando';
    digitando.innerHTML = `
      <div class="msg-conteudo">
        <div class="loading">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    `;
    chat.appendChild(digitando);
    chat.scrollTop = chat.scrollHeight;
    
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelo,
          prompt: texto,
          stream: false
        })
      });
      
      if (!res.ok) throw new Error('Erro');
      
      const data = await res.json();
      const resposta = data.response;
      
      document.getElementById('digitando').remove();
      adicionarMensagem(resposta, 'ia');
      
    } catch (e) {
      document.getElementById('digitando').remove();
      adicionarMensagem('❌ Erro: ' + e.message, 'ia');
    }
  }
  
  function adicionarMensagem(texto, tipo) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'mensagem ' + tipo;
    div.innerHTML = `<div class="msg-conteudo">${texto}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  
  // Auto-conectar ao carregar
  window.addEventListener('load', conectar);
</script>

</body>
</html>
